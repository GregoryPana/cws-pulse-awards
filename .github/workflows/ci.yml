name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  backend-phase0:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: phase0-test-password
      DATABASE_URL: postgresql+asyncpg://pulse:phase0-test-password@127.0.0.1:5433/pulse_awards
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend and sidecar dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r pdf_service/requirements.txt

      - name: Start Phase 0 support services
        run: docker compose up -d --build

      - name: Wait for compose health checks
        run: |
          for attempt in {1..30}; do
            if docker compose ps --format json | grep '"Health":"healthy"' >/dev/null; then
              count=$(docker compose ps --format json | grep -c '"Health":"healthy"')
              if [ "$count" -ge 2 ]; then
                exit 0
              fi
            fi
            sleep 5
          done
          docker compose ps
          exit 1

      - name: Apply Alembic migration
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run backend and sidecar tests
        run: python -m pytest backend/tests
